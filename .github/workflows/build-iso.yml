name: Build XisfBN ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-iso:
    name: Build amd64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build ISO inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          sync: rsync
          run: |
            set -e

            cd "$GITHUB_WORKSPACE"

            NPROC=$(sysctl -n hw.ncpu)

            echo "Building world..."
            make -j$NPROC TARGET=amd64 TARGET_ARCH=amd64 buildworld

            echo "Building kernel..."
            make -j$NPROC TARGET=amd64 TARGET_ARCH=amd64 KERNCONF=GENERIC buildkernel

            echo "Building release ISO..."
            cd release
            make -DNOPORTS -DNOSRC -DNODOC TARGET=amd64 TARGET_ARCH=amd64 KERNCONF=GENERIC release

            echo "Collecting images..."
            mkdir -p "$GITHUB_WORKSPACE/out"
            find . -type f \( -name "*.iso" -o -name "*.img" -o -name "*.txz" \) -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;

            echo "Final files:"
            ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: XisfBN-ISO-amd64
          path: out/*
          retention-days: 1
